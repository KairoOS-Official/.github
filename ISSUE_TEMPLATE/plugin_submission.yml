name: 🧩 Soumettre un plugin officiel
description: Proposer un plugin pour la section official/ (revue équipe requise)
labels: [plugin]
body:
  - type: input
    id: name
    attributes:
      label: Nom du dossier
      description: Sans préfixe pseudo- (réservé aux plugins officiels)
      placeholder: ex. kairo-achievements
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Lien (PR, repo ou dossier)
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: Description
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "`plugin.json` présent et valide (id, version, permissions, entry)"
          required: true
        - label: "`README.md` présent (installation + usage)"
          required: true
        - label: "Testé : suppression du dossier = zéro crash du core"
          required: true
        - label: "Protocole stdin/stdout JSON respecté"
          required: true
