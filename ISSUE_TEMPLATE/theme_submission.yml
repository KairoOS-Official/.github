name: 🎨 Soumettre un thème officiel
description: Proposer un thème pour la section official/ (revue équipe requise)
labels: [theme]
body:
  - type: input
    id: name
    attributes:
      label: Nom du dossier
      description: Sans préfixe pseudo- (réservé aux thèmes officiels)
      placeholder: ex. kairo-neon
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Lien (PR, repo ou dossier)
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: Description
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "JSON du thème valide"
          required: true
        - label: "Assets présents (fonds, polices, icônes)"
          required: true
        - label: "`README.md` présent avec capture d'écran"
          required: true
        - label: "Lisible sur TV (contrastes, taille de police)"
          required: true
