name: 💡 Feature request
description: Proposer une nouveauté
labels: [enhancement]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Repo concerné
      options:
        - KairoOS (app)
        - kairos-plugins
        - kairos-themes
        - kairos-website
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: Quel problème ça résout ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Comment ça devrait marcher (penser manette : D-Pad/A/B) ?
    validations:
      required: true
  - type: dropdown
    id: gamepad
    attributes:
      label: Utilisable à la manette ?
      options:
        - Oui
        - Non concerné (pas d'UI)
        - Je ne sais pas
