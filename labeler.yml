# Labels automatiques sur les PR (à référencer via actions/labeler dans chaque repo).
# Fichier attendu à la racine du repo : .github/labeler.yml — copiez ce modèle.
core:
  - changed-files:
      - any-glob-to-any-file: ['crates/**', 'src-tauri/**']
frontend:
  - changed-files:
      - any-glob-to-any-file: ['src/**', 'index.html', 'vite.config.ts', 'tailwind.config.js']
plugin:
  - changed-files:
      - any-glob-to-any-file: ['plugins/**', 'official/**', 'community/**', 'plugin.json']
theme:
  - changed-files:
      - any-glob-to-any-file: ['themes/**', '*.json']
docs:
  - changed-files:
      - any-glob-to-any-file: ['*.md', 'docs/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**']
