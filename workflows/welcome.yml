# Accueille les nouveaux contributeurs. Copiez ce fichier dans le repo concerné
# (.github/workflows/welcome.yml) — il ne tourne pas depuis le repo .github lui-même.
name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Bienvenue sur KairoOS et merci pour votre première issue ! 🕹️
            L'équipe y jettera un œil vite. Pensez à préciser repo, version et logs.
          pr-message: >
            Bienvenue et merci pour votre première PR ! 🎮
            Vérifiez la checklist du template (branche, commits, test manette)
            puis un mainteneur vous répondra.
